[package]
name = "tailscale-vita-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Phase 2: std-based staticlib that runs the full tailscale-vita Runtime
# inside a SUPRX-spawned thread. Phase 1's no_std + alloc-only structure
# is gone; the TaipoolAllocator stays as our `#[global_allocator]`.
[lib]
name        = "tailscale_vita_rt"
crate-type  = ["staticlib"]

[dependencies]
# Path deps — the runtime + log + listener types we wrap.
tailscale-vita = { path = "../tailscale-vita" }
vita-log       = { path = "../vita-log" }
netstack       = { path = "../netstack" }
vita-thread    = { path = "../vita-thread" }

# Workspace deps for the runtime body + worker thread.
crossbeam-channel = { workspace = true }
tracing           = { workspace = true }
