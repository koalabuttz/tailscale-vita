[package]
name = "ts-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ureq        = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
base64      = { workspace = true }
vita-log = { path = "../vita-log" }
thiserror   = { workspace = true }
vita-sync   = { path = "../vita-sync" }
# M5: Noise IK + HTTP/2 over the Noise tunnel
snow        = { workspace = true }
chacha20poly1305 = { workspace = true }
httparse    = { workspace = true }
h2          = { workspace = true }
tokio       = { workspace = true }
bytes       = { workspace = true }
http        = "1"
# M6: persistent keys (machine, node, disco) + RFC3339 timestamps for register
x25519-dalek = { workspace = true }
rand_core    = { workspace = true }
time         = { workspace = true }
# M7: gunzip Headscale's HTTP/2 DATA stream (Content-Encoding: gzip)
flate2       = { workspace = true }
# M14G: decompress real-Tailscale's per-frame zstd MapResponse bodies
# (when client sends `MapRequest.Compress = "zstd"`). Pure-Rust, no C deps.
ruzstd       = { workspace = true }
# M14: rustls + webpki for HTTPS to controlplane.tailscale.com
rustls           = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots     = { workspace = true }
vita-thread      = { path = "../vita-thread" }
vita-fs          = { path = "../vita-fs" }

# Phase 9 host-diagnostic example (`examples/host_diagnostic.rs`).
# Built only by `cargo run --example host_diagnostic` — does NOT bloat
# the production library or the Vita VPK.
[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing = { workspace = true }
