[package]
name = "tailscale-vita-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# M10: demo links the public Runtime API. The lower-level
# ts-control/ts-derp/wg-engine crates are no longer direct deps.
vita-log       = { path = "../vita-log" }
netstack       = { path = "../netstack" }
tailscale-vita = { path = "../tailscale-vita" }

# Public crate types we touch directly.
vita-chan         = { path = "../vita-chan" }
vita-thread       = { path = "../vita-thread" }
vita-fs           = { path = "../vita-fs" }

# M17-A: the dashboard deserializes LocalAPI JSON into the exact
# snapshot types tailscale-vita serializes.
serde             = { workspace = true }
serde_json        = { workspace = true }

# M18: QR-encode the interactive-login AuthURL (ui/qr.rs). Zero-dep,
# std-only, forbid(unsafe) — cross-compiles cleanly under -Z build-std.
qrcodegen         = "1.8"

[package.metadata.vita]
title_id   = "TVIT00010"
title_name = "Tailscale-Vita Demo"
vita_make_fself_flags = []
