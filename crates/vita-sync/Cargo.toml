# and SCE kernel mutex primitives (Vita SUPRX backend). Pulling in deps
# would risk transitive thread_local/std::sync::Mutex usage that
# defeats the purpose (see docs/SUPRX-PTHREAD-INVESTIGATION.md and
# the M15-A2 deferral notes).
[dependencies]
