[package]
name = "ts-derp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# wg-engine for the Transport trait + TransportAddr enum
wg-engine = { path = "../wg-engine" }

# Crypto: NaCl box for DERP ClientInfo/ServerInfo handshake
crypto_box = { workspace = true }
x25519-dalek = { workspace = true }
rand_core = { workspace = true }

# TLS + HTTP/1.1 upgrade
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
httparse = { workspace = true }

# JSON for ClientInfo/ServerInfo bodies
serde = { workspace = true }
serde_json = { workspace = true }

# Concurrency / locking
vita-sync = { path = "../vita-sync" }
arc-swap = { workspace = true }
vita-chan = { path = "../vita-chan" }

# Logging + errors
vita-log = { path = "../vita-log" }
thiserror = { workspace = true }

# M15-A2: SUPRX-safe thread spawn (sceKernelCreateThread on Vita).
vita-thread = { path = "../vita-thread" }
