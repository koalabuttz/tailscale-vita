[package]
name = "ts-magicsock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# M12D: shared UDP socket for Disco probing (Ping/Pong) AND direct-path
# WireGuard traffic. Receive worker dispatches by inspecting magic
# bytes — Disco frames stay internal (state machine + Pong reply);
# everything else is forwarded via crossbeam channel for wg-engine.

[dependencies]
ts-disco          = { path = "../ts-disco" }
# `DirectPathHint` trait — wg-engine's pump consults a `MagicSocketCtl`
# at send time to prefer a Disco-validated direct UDP path.
wg-engine         = { path = "../wg-engine" }
crypto_box        = { workspace = true }
vita-sync         = { path = "../vita-sync" }
vita-chan         = { path = "../vita-chan" }
rand_core         = { workspace = true }
zerocopy          = { workspace = true, features = ["derive"] }
tracing           = { workspace = true }
thiserror         = { workspace = true }
vita-thread       = { path = "../vita-thread" }

[dev-dependencies]
rand = "0.8"
