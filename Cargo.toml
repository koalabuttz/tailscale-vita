[workspace]
resolver = "2"
members = [
    "crates/vita-thread",
    "crates/vita-sync",
    "crates/vita-chan",
    "crates/vita-fs",
    "crates/vita-log",
    "crates/wg-engine",
    "crates/netstack",
    "crates/ts-control",
    "crates/ts-derp",
    "crates/ts-disco",
    "crates/ts-magicsock",
    "crates/ts-ftp",
    "crates/tailscale-vita",
    "crates/tailscale-vita-demo",
    "crates/tailscale-vita-rt",
]
# Phase-0 spikes are standalone crates with their own [patch.crates-io] and
# build profiles. Keep them out of the workspace so they remain reproducible
# historical artifacts.
exclude = [
    "spikes/01-hello-rust",
    "spikes/02-udp-echo",
    "spikes/03-boringtun-compile",
    "spikes/04-smoltcp-compile",
    "spikes/05-crypto-box-compile",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
# --- crypto + WireGuard (Phase-0 baseline) ---
boringtun        = { path = "vendor/boringtun", default-features = false }
x25519-dalek     = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
blake2           = "0.10"
hkdf             = "0.12"
getrandom        = "0.2"
rand_core        = { version = "0.6", features = ["getrandom"] }
subtle           = "2"
parking_lot      = "0.12"
smoltcp = { version = "0.12", default-features = false, features = [
    "std", "log", "medium-ip", "proto-ipv4",
    "socket-tcp", "socket-udp", "socket-icmp",
] }

# --- Noise IK ---
snow = { version = "0.10", default-features = false, features = [
    "default-resolver", "use-curve25519", "use-chacha20poly1305", "use-blake2",
    "use-getrandom", "std",
] }

# --- TLS + HTTPS ---
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots     = "1"
ureq             = { version = "3",  default-features = false, features = ["rustls", "json"] }
httparse         = { version = "1",  default-features = false, features = ["std"] }

# --- HTTP/2 inside Noise (M5; Plan A primary, see crates/ts-control/M5a-DECISION.md) ---
h2    = "0.4"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }

# --- DERP NaCl box (M8; cross-compile spike at head of M8) ---
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }

# --- Disco wire format (M12; lifted from tailscale-rs::ts_disco_protocol) ---
aead       = { version = "0.5", default-features = false }
zerocopy   = { version = "0.8", default-features = false, features = ["alloc"] }
num-traits = { version = "0.2", default-features = false }
num-derive = "0.4"

# --- Concurrency (no async runtime for the rest of the system) ---
crossbeam-channel = "0.5"

# --- JSON / serialization ---
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Compression (Headscale gzips MapResponse bodies) ---
# Use `zlib-rs` (pure-Rust port of zlib) instead of miniz_oxide. miniz_oxide's
# Cargo.toml in flate2 1.1.9 forces `simd-adler32`, whose ARM NEON path uses
# the unstable `stdarch_arm_neon_intrinsics` feature and fails to cross-compile
# to `armv7-sony-vita-newlibeabihf`. zlib-rs avoids that dep entirely.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# --- zstd (real-Tailscale's MapResponse inner-frame compression; M14G) ---
# `ruzstd` is a pure-Rust zstd decoder (no C bindings, no_std-capable).
# We only need to decode — the request body's `Compress: "zstd"` field
# tells the server to use zstd for outgoing frames; we never encode.
ruzstd = { version = "0.7", default-features = false, features = ["std"] }

# --- Logging ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

# --- Helpers ---
base64    = { version = "0.22", default-features = false, features = ["alloc"] }
bytes     = "1"
bytemuck  = "1"
time      = { version = "0.3", default-features = false, features = ["macros", "parsing", "formatting", "serde", "alloc"] }
thiserror = "1"
arc-swap  = "1"
toml      = { version = "0.8", default-features = false, features = ["parse"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Host dev/test builds. We never gdb the host binaries (real debugging is
# on-device via vita.log / phase2-trace.txt), so full DWARF is pure disk
# cost: `debug = "line-tables-only"` keeps panic/backtrace line numbers while
# cutting `target/debug/deps` from ~5G to ~1.5G on this space-tight Crostini
# VM. `debug=0` would shrink it further but drop backtrace line info.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
panic     = "unwind"
lto       = true
opt-level = 2

# `staticlib` profile is used by the *.suprx Rust shim (crates/tailscale-vita-rt).
# Phase 2 switched to `panic = "unwind"` because the shim now uses std +
# `std::panic::catch_unwind` (the Phase 1 staticlib was no_std + panic=abort).
# Different artifact dir from `release/` so it never co-builds with the demo eboot.
[profile.staticlib]
inherits  = "release"
panic     = "unwind"
opt-level = "z"

[patch.crates-io]
ring = { git = "https://github.com/vita-rust/ring", branch = "v0.17.14-vita" }
